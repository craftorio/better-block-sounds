name: Release

# Tag formats:
#   release/<mod_version>   e.g. release/1.20.1-0.1.3-ex120
#   <mod_version>           e.g. 1.20.1-0.1.3-ex120 (loose tag matching the gradle.properties value)
on:
  push:
    tags:
      - "release/*"
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      mod_version:
        description: Mod version (overrides gradle.properties)
        required: true
        default: "1.20.1-0.1.4"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve versions
        id: versions
        run: |
          read_prop() {
            grep -E "^$1[[:space:]]*=" gradle.properties | sed 's/.*=[[:space:]]*//' | tr -d ' '
          }

          mod_id="$(read_prop archives_base_name)"
          minecraft_version="$(read_prop minecraft_version)"
          mod_version_default="$(read_prop mod_version)"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="${{ github.event.inputs.mod_version }}"
            mod_version="${{ github.event.inputs.mod_version }}"
          else
            release_tag="${GITHUB_REF_NAME}"
            if [[ "$release_tag" == release/* ]]; then
              mod_version="${release_tag#release/}"
            else
              mod_version="$release_tag"
            fi
          fi

          echo "release_tag=$release_tag"      >> "$GITHUB_OUTPUT"
          echo "mod_id=$mod_id"                >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$minecraft_version" >> "$GITHUB_OUTPUT"
          echo "mod_version=$mod_version"      >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: |
          ./gradlew build --no-daemon \
            -Pmod_version="${{ steps.versions.outputs.mod_version }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versions.outputs.release_tag }}
          name: Better Block Sounds ${{ steps.versions.outputs.mod_version }}
          body: |
            Mod version: `${{ steps.versions.outputs.mod_version }}`
            Minecraft: `${{ steps.versions.outputs.minecraft_version }}`
            Tag: `${{ steps.versions.outputs.release_tag }}`
          files: |
            forge/build/libs/${{ steps.versions.outputs.mod_id }}-${{ steps.versions.outputs.mod_version }}-forge.jar
            fabric/build/libs/${{ steps.versions.outputs.mod_id }}-${{ steps.versions.outputs.mod_version }}-fabric.jar
            quilt/build/libs/${{ steps.versions.outputs.mod_id }}-${{ steps.versions.outputs.mod_version }}-quilt.jar
          generate_release_notes: true
